# ==================== BUILD STAGE ====================
build:backend:
  stage: build
  tags: 
    - vps
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "Waiting for Docker daemon..."
    - for i in {1..30}; do docker info >/dev/null 2>&1 && break || (echo "Retry $i"; sleep 1); done
    - echo "Docker daemon is ready ✅"
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build -t $BACKEND_IMAGE ./backend
    - docker push $BACKEND_IMAGE
  only:
    - main
    - develop
    - merge_requests
    - ci-testing


